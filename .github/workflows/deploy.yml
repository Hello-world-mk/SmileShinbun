name: Generate Directory Listing

on:
  push:
    branches:
      - main # または master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ディレクトリ一覧のHTMLを自動生成するアクションの例
      - name: Generate Directory Listing
        uses: jayanta525/github-pages-directory-listing@v4.0.0
        with:
          FOLDER: "." # 一覧化したい対象フォルダ

      # 生成されたインデックスをGitHub Pagesにデプロイ（またはプッシュ）するステップをここに記述します
