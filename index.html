<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileShinbun Browser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .breadcrumb {
            margin-bottom: 20px;
            font-size: 14px;
        }
        .breadcrumb a {
            cursor: pointer;
            color: #0066cc;
            text-decoration: none;
            margin: 0 5px;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        .file-list {
            background: white;
            border: 1px solid #ddd;
            list-style: none;
            padding: 0;
        }
        .file-item {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .file-item:hover {
            background: #f9f9f9;
        }
        .directory {
            font-weight: bold;
            color: #0066cc;
        }
        .file-link {
            color: #333;
        }
        .file-size {
            color: #999;
            font-size: 12px;
            margin-left: 10px;
        }
        .error {
            color: red;
            margin: 10px 0;
        }
        .loading {
            color: #666;
        }
    </style>
</head>
<body>
    <h1>SmileShinbun Browser</h1>
    
    <div class="breadcrumb">
        <a onclick="navigateTo('')">root</a>
        <span id="breadcrumb-path"></span>
    </div>

    <div id="error" class="error"></div>
    <div id="loading" class="loading" style="display: none;">Loading...</div>
    <ul id="file-list" class="file-list"></ul>

    <script src="script.js"></script>
</body>
</html>
