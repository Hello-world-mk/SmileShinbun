name: Deploy Jekyll Site with Assets

on:
  push:
    branches:
      - main  # または master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub公式のJekyll環境セットアップ
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # GitHub公式のJekyllビルド（ここで自動的にpng, gif, pdf等も処理されます）
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # ビルドされた成果物をアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      # GitHub Pagesへデプロイ（Web公開）
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
