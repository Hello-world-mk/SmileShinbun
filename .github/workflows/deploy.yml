name: Generate Directory Listing and Deploy

on:
  push:
    branches:
      - main # 💡 もしブランチ名が「master」なら master に書き換えてください

permissions:
  contents: read
  pages: write      # GitHub Pagesへのデプロイに必要
  id-token: write   # 安全な認証に必要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ 安定した別のActionでファイル一覧（index.html）を自動生成
      - name: Generate Directory Listing
        uses: JayRizzo/directory-listing-action@v0.0.3
        with:
          # 一覧に含めたくないファイル（設定ファイルなど）を除外
          exclude: '.git* .github*'

      # GitHub Pages用にファイルをアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub Pagesへ安全に公開
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
